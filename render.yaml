services:
  - type: web
    name: nexopc
    env: docker
    plan: free
    branch: main
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        value: nexopc@gmail.com
      - key: MAIL_FROM_NAME
        value: NexoPC
